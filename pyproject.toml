[project]
name = "u4cast"
version = "0.1.0"
description = "Forecast many time series at once with Mistral's Timestral model on Cloudera AI"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
# What is needed to run Timestral itself. Tests do not need it: they use a stand-in model.
model = [
    "torch>=2.4",
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/u4cast"]

[tool.hatch.metadata]
allow-direct-references = true

# torch comes from the CPU-only index: the default build bundles GPU libraries the project does not use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: runs the real Timestral model; needs the model extra and downloaded weights",
    "spark: runs against real Spark and Iceberg; needs Cloudera AI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "serving"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN", "T20", "PT"]
ignore = [
    "ANN401",  # Any is the honest type for values read from a data frame
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
